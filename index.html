            { id: "g25682bf02f2_0_1", keywords: "meetings that don’t suck know the objectives prepare & have an agenda pre-share the objectives & agenda start on time let the discussion ebb and flow while keeping focus on objectives everyone’s participating everyone’s considering all points of view action plan for success is created end on time or early if objectives achieved commitments are made - smiles all around" },
            { id: "g21d0a97e01c_0_300", keywords: "pricing philosophy at miles it, we strive to live out our core focus of “helping people accomplish more”. one of the ways we help our customers accomplish this is through trust-based pricing. in the world we live in, it is commonplace for people to price their products and services with prices that are higher than they need to be to allow for a reduction in price when requested. while haggling can create temporary satisfaction and good vibes, long-term it is harmful to maintaining good customer relationships. if we have soft pricing, how does the customer know they ever got a good deal? they are left wondering if they could have gotten a lower price by negotiating further. also, by proposing a higher price, if the customer doesn’t request a reduction we would be overcharging them. if a customer is asked, “do you want me to give you a little bit higher price so that we can negotiate…or…do you want me to actually price it where it needs to be for us to succeed for you?”, the customer will always pick the latter. in order to earn our customer’s trust, we never overcharge. our prices are real. our pricing is correct. our price only changes by the scope of the products & services selected. through this our customer knows they can call, we’ll respond and the job will get done without the hassle and time of negotiation. they know that they get a fair price, every time! our goal is for us to be our customers’ company of choice for our services forever." },

        // Includes &rm=minimal parameter to strip away Google's native bottom control shelf
        const baseUrl = "https://docs.google.com/presentation/d/16m363rm8KbODBF4_73Jt824KoW6NaEQsueUZ_LTdyFU/embed?start=false&loop=false&delayms=3000&rm=minimal";

        let currentMatches = JSON.parse(sessionStorage.getItem('currentMatches')) || [];
        let currentIndex = parseInt(sessionStorage.getItem('currentIndex')) || 0;
        let lastQuery = sessionStorage.getItem('lastQuery') || '';

        function getUrlParam(name) {
            const results = new RegExp('[\?&]' + name + '=([^&#]*)').exec(window.location.href);
            return results ? results[1] : null;
        }

        window.onload = function() {
            const targetSlide = getUrlParam('slide') || 'id.p';
            document.getElementById('slidesIframe').src = baseUrl + "&slide=" + targetSlide;

            if (lastQuery) {
                document.getElementById('searchInput').value = lastQuery;
                updateNavigationUI();
            }
        };

        function startNewSearch() {
            const rawQuery = document.getElementById('searchInput').value.toLowerCase().trim();
            const query = rawQuery.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g,"");
            const errorDiv = document.getElementById('errorMessage');

            if (!query) { 
                errorDiv.style.display = "none"; 
                return; 
            }

            const matches = [];
            slideData.forEach(item => {
                const cleanKeywords = item.keywords.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g,"");
                if (cleanKeywords.includes(query)) {
                    matches.push(item.id);
                }
            });

            if (matches.length > 0) {
                errorDiv.style.display = "none";
                sessionStorage.setItem('currentMatches', JSON.stringify(matches));
                sessionStorage.setItem('currentIndex', '0');
                sessionStorage.setItem('lastQuery', rawQuery);
                executeRedirect(matches[0]);
            } else {
                errorDiv.textContent = `"${rawQuery}" not found in the Success Wheel.`;
                errorDiv.style.display = "block";
                document.getElementById('navControls').style.display = 'none';
                sessionStorage.clear();
            }
        }

        function navigateMatches(direction) {
            if (currentMatches.length <= 1) return;

            let newIndex = currentIndex + direction;
            if (newIndex >= currentMatches.length) newIndex = 0;
            if (newIndex < 0) newIndex = currentMatches.length - 1;

            sessionStorage.setItem('currentIndex', newIndex.toString());
            executeRedirect(currentMatches[newIndex]);
        }

        function updateNavigationUI() {
            const navControls = document.getElementById('navControls');
            const matchCountLabel = document.getElementById('matchCount');

            if (currentMatches.length > 0) {
                navControls.style.display = 'flex';
                matchCountLabel.textContent = `${currentIndex + 1} of ${currentMatches.length}`;
            } else {
                navControls.style.display = 'none';
            }
        }

        function executeRedirect(slideId) {
            const currentUrlWithoutParams = window.location.href.split('?')[0];
            window.location.href = currentUrlWithoutParams + "?slide=id." + slideId;
        }

        document.getElementById('searchInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') { startNewSearch(); }
        });
    </script>
