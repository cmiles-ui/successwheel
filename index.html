<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Success Wheel Search Dashboard</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; 
            margin: 0; 
            padding: 10px 20px; 
            background-color: #f8f9fa; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 1100px;
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
        }
        .container:fullscreen {
            max-width: 100vw;
            width: 100vw;
            height: 100vh;
            background: #000000;
            padding: 20px;
            border-radius: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .search-box { 
            margin: 0 auto 12px auto; 
            max-width: 550px; 
            display: flex; 
            gap: 6px; 
            align-items: center;
            width: 100%;
        }
        .container:fullscreen .search-box {
            max-width: 700px;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 8px;
        }
        input[type="text"] { 
            flex: 1; 
            padding: 8px 12px; 
            font-size: 14px; 
            border: 1.5px solid #e0e0e0; 
            border-radius: 6px; 
            outline: none; 
            transition: border-color 0.2s;
        }
        input[type="text"]:focus { border-color: #1a73e8; }
        button { 
            padding: 8px 16px; 
            font-size: 14px; 
            background-color: #1a73e8; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: 600; 
            white-space: nowrap;
        }
        button:hover { background-color: #1557b0; }
        
        .fullscreen-btn {
            background-color: #3c4043;
        }
        .fullscreen-btn:hover { background-color: #202124; }
        
        .nav-controls {
            display: none; 
            gap: 4px;
            align-items: center;
        }
        .nav-btn {
            background-color: #f1f3f4;
            color: #3c4043;
            padding: 8px 12px;
            font-size: 13px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        .nav-btn:hover { background-color: #e8eaed; }
        
        .container:fullscreen .nav-btn {
            background-color: #3c4043;
            color: #fff;
        }
        .container:fullscreen .nav-btn:hover { background-color: #4f5357; }

        .match-count {
            font-size: 13px;
            color: #5f6368;
            min-width: 70px;
            text-align: center;
            font-weight: 500;
        }
        .container:fullscreen .match-count {
            color: #e8eaed;
        }

        .error-message { 
            color: #d93025; 
            font-size: 13px; 
            margin-top: -6px; 
            margin-bottom: 8px; 
            display: none; 
            text-align: center; 
            font-weight: 500;
        }
        .iframe-wrapper { 
            position: relative; 
            width: 100%; 
            padding-top: 56.25%; 
            height: 0; 
            border-radius: 8px; 
            overflow: hidden; 
            background: #000; 
        }
        .container:fullscreen .iframe-wrapper {
            flex: 1;
            padding-top: 0;
            height: auto;
        }
        iframe { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            border: none; 
        }
    </style>
    
    <!-- Externalizing the full OCR index data cleanly -->
    <script src="data.js"></script>
</head>
<body>

    <div class="container" id="dashboardContainer">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search the Success Wheel...">
            <button onclick="startNewSearch()">Search</button>
            
            <div class="nav-controls" id="navControls">
                <button class="nav-btn" onclick="navigateMatches(-1)">◀</button>
                <span class="match-count" id="matchCount">0 of 0</span>
                <button class="nav-btn" onclick="navigateMatches(1)">▶</button>
            </div>
            
            <button class="fullscreen-btn" id="fsToggleBtn" onclick="toggleFullscreen()">⛶ Fullscreen</button>
        </div>
        <div id="errorMessage" class="error-message"></div>

        <div class="iframe-wrapper">
            <iframe id="slidesIframe" allowfullscreen="true"></iframe>
        </div>
    </div>

    <script>
        const baseUrl = "https://docs.google.com/presentation/d/16m363rm8KbODBF4_73Jt824KoW6NaEQsueUZ_LTdyFU/embed?start=false&loop=false&delayms=3000&rm=minimal";

        // Pull states reliably from standard cache
        let currentMatches = JSON.parse(sessionStorage.getItem('currentMatches')) || [];
        let currentIndex = parseInt(sessionStorage.getItem('currentIndex')) || 0;
        let lastQuery = sessionStorage.getItem('lastQuery') || '';

        function getUrlParam(name) {
            const results = new RegExp('[\?&]' + name + '=([^&#]*)').exec(window.location.href);
            return results ? results[1] : null;
        }

        window.onload = function() {
            const targetSlide = getUrlParam('slide') || 'id.p';
            document.getElementById('slidesIframe').src = baseUrl + "&slide=" + targetSlide;

            if (lastQuery) {
                document.getElementById('searchInput').value = lastQuery;
                updateNavigationUI();
            }
        };

        function startNewSearch() {
            const rawQuery = document.getElementById('searchInput').value.toLowerCase().trim();
            const query = rawQuery.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g,"");
            const errorDiv = document.getElementById('errorMessage');

            if (!query) { 
                errorDiv.style.display = "none"; 
                return; 
            }

            // Looks directly at the global array initialized by your data.js file
            const targetData = window.slideData || [];
            const matches = [];
            
            targetData.forEach(item => {
                const cleanKeywords = item.keywords.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g,"");
                if (cleanKeywords.includes(query)) {
                    matches.push(item.id);
                }
            });

            if (matches.length > 0) {
                errorDiv.style.display = "none";
                currentMatches = matches;
                currentIndex = 0;
                
                sessionStorage.setItem('currentMatches', JSON.stringify(matches));
                sessionStorage.setItem('currentIndex', '0');
                sessionStorage.setItem('lastQuery', rawQuery);
                
                executeRedirect(matches[0]);
            } else {
                errorDiv.textContent = `"${rawQuery}" not found in the Success Wheel.`;
                errorDiv.style.display = "block";
                document.getElementById('navControls').style.display = 'none';
                sessionStorage.clear();
            }
        }

        function navigateMatches(direction) {
            if (currentMatches.length <= 1) return;

            currentIndex = currentIndex + direction;
            if (currentIndex >= currentMatches.length) currentIndex = 0;
            if (currentIndex < 0) currentIndex = currentMatches.length - 1;

            sessionStorage.setItem('currentIndex', currentIndex.toString());
            executeRedirect(currentMatches[currentIndex]);
        }

        function updateNavigationUI() {
            const navControls = document.getElementById('navControls');
            const matchCountLabel = document.getElementById('matchCount');

            if (currentMatches.length > 0) {
                navControls.style.display = 'flex';
                matchCountLabel.textContent = `${currentIndex + 1} of ${currentMatches.length}`;
            } else {
                navControls.style.display = 'none';
            }
        }

        function executeRedirect(slideId) {
            const currentUrlWithoutParams = window.location.href.split('?')[0];
            const newUrl = currentUrlWithoutParams + "?slide=id." + slideId;
            
            history.pushState({slide: slideId}, '', newUrl);
            document.getElementById('slidesIframe').src = baseUrl + "&slide=id." + slideId;
            updateNavigationUI();
        }

        function toggleFullscreen() {
            const container = document.getElementById('dashboardContainer');
            const fsBtn = document.getElementById('fsToggleBtn');

            if (!document.fullscreenElement) {
                container.requestFullscreen().then(() => {
                    fsBtn.textContent = "Collapse";
                }).catch(err => {
                    console.error(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
                fsBtn.textContent = "⛶ Fullscreen";
            }
        }

        document.addEventListener('fullscreenchange', () => {
            const fsBtn = document.getElementById('fsToggleBtn');
            if (!document.fullscreenElement) {
                fsBtn.textContent = "⛶ Fullscreen";
            }
        });

        document.getElementById('searchInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') { startNewSearch(); }
        });
    </script>
</body>
</html>
