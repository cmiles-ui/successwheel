<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Success Wheel Search Dashboard</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; 
            margin: 0; 
            padding: 10px 20px; 
            background-color: #000000; 
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 1100px;
            background: #121212;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.5);
            border: 1px solid #222222;
            transition: all 0.3s ease;
        }
        .container:fullscreen {
            max-width: 100vw;
            width: 100vw;
            height: 100vh;
            background: #000000;
            padding: 20px;
            border-radius: 0;
            border: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .search-box { 
            margin: 0 auto 12px auto; 
            max-width: 550px; 
            display: flex; 
            gap: 6px; 
            align-items: center;
            width: 100%;
        }
        .container:fullscreen .search-box {
            max-width: 700px;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 8px;
        }
        input[type="text"] { 
            flex: 1; 
            padding: 8px 12px; 
            font-size: 14px; 
            background-color: #1e1e1e;
            color: #ffffff;
            border: 1.5px solid #333333; 
            border-radius: 6px; 
            outline: none; 
            transition: border-color 0.2s;
            height: 35px;
        }
        input[type="text"]::placeholder { color: #888888; }
        input[type="text"]:focus { border-color: #1a73e8; }
        button { 
            padding: 0; 
            font-size: 14px; 
            background-color: #1a73e8; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: 600; 
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 35px;
            width: 35px;
            flex-shrink: 0;
        }
        button:hover { background-color: #1557b0; }
        button svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }
         
        .icon-btn {
            background-color: #2c2c2e;
            color: #ffffff;
        }
        .icon-btn:hover { background-color: #3a3a3c; }
         
        .nav-controls {
            display: none; 
            gap: 4px;
            align-items: center;
        }
        .nav-btn {
            background-color: #2c2c2e;
            color: #ffffff;
            padding: 0 12px;
            font-size: 13px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            height: 35px;
            width: auto;
        }
        .nav-btn:hover { background-color: #3a3a3c; }

        .match-count {
            font-size: 13px;
            color: #e8eaed;
            min-width: 70px;
            text-align: center;
            font-weight: 500;
        }

        .error-message { 
            color: #f28b82; 
            font-size: 13px; 
            margin-top: -6px; 
            margin-bottom: 8px; 
            display: none; 
            text-align: center; 
            font-weight: 500;
        }
        .iframe-wrapper { 
            position: relative; 
            width: 100%; 
            padding-top: 56.25%; 
            height: 0; 
            border-radius: 8px; 
            overflow: hidden; 
            background: #000; 
        }
        .container:fullscreen .iframe-wrapper {
            flex: 1;
            padding-top: 0;
            height: auto;
        }
        iframe { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            border: none; 
        }
    </style>
    <script src="data.js"></script>
</head>
<body>

    <div class="container" id="dashboardContainer">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search the Success Wheel...">
            <button onclick="startNewSearch()" title="Search">
                <!-- Magnifying Glass Search SVG Icon -->
                <svg viewBox="0 0 24 24">
                    <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                </svg>
            </button>
             
            <div class="nav-controls" id="navControls">
                <button class="nav-btn" onclick="navigateMatches(-1)">◀</button>
                <span class="match-count" id="matchCount">0 of 0</span>
                <button class="nav-btn" onclick="navigateMatches(1)">▶</button>
            </div>
             
            <button class="icon-btn" id="fsToggleBtn" onclick="toggleFullscreen()" title="Toggle Fullscreen">
                <!-- Fullscreen Expand SVG Icon -->
                <svg id="fsIcon" viewBox="0 0 24 24">
                    <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
                </svg>
            </button>
        </div>
        <div id="errorMessage" class="error-message"></div>

        <div class="iframe-wrapper">
            <iframe id="slidesIframe" allowfullscreen="true"></iframe>
        </div>
    </div>

    <script>
        const baseUrl = "https://docs.google.com/presentation/d/16m363rm8KbODBF4_73Jt824KoW6NaEQsueUZ_LTdyFU/embed?start=false&loop=false&delayms=3000&rm=minimal";

        // SVG icon definitions for easy switching
        const expandIconPath = '<path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>';
        const compressIconPath = '<path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/>';

        let currentMatches = JSON.parse(sessionStorage.getItem('currentMatches')) || [];
        let currentIndex = parseInt(sessionStorage.getItem('currentIndex')) || 0;
        let lastQuery = sessionStorage.getItem('lastQuery') || '';

        function getUrlParam(name) {
            const results = new RegExp('[\?&]' + name + '=([^&#]*)').exec(window.location.href);
            return results ? results[1] : null;
        }

        document.addEventListener("DOMContentLoaded", function() {
            const rawSlideParam = getUrlParam('slide') || 'id.p';
            let cleanSlideId = rawSlideParam.replace(/^id\./gi, '');
            const targetSlide = "id." + cleanSlideId;

            const iframe = document.getElementById('slidesIframe');
            if (iframe) {
                iframe.src = baseUrl + "&slide=" + targetSlide;
            }

            if (lastQuery) {
                const inputField = document.getElementById('searchInput');
                if (inputField) inputField.value = lastQuery;
                updateNavigationUI();
            }

            const inputField = document.getElementById('searchInput');
            if (inputField) {
                inputField.addEventListener('keypress', function (e) {
                    if (e.key === 'Enter') { startNewSearch(); }
                });
            }
        });

        function startNewSearch() {
            const inputField = document.getElementById('searchInput');
            if (!inputField) return;
             
            const rawQuery = inputField.value.toLowerCase().trim();
            const errorDiv = document.getElementById('errorMessage');

            if (!rawQuery) { 
                if (errorDiv) errorDiv.style.display = "none"; 
                return; 
            }

            const masterData = window.slideData || [];
            const matches = [];

            masterData.forEach(item => {
                if (!item.keywords) return;
                const text = item.keywords.toLowerCase();

                // Strict Exact Phrase Match
                if (text.includes(rawQuery)) {
                    matches.push(item.id);
                }
            });

            if (matches.length > 0) {
                if (errorDiv) errorDiv.style.display = "none";
                currentMatches = matches;
                currentIndex = 0;
                 
                sessionStorage.setItem('currentMatches', JSON.stringify(matches));
                sessionStorage.setItem('currentIndex', '0');
                sessionStorage.setItem('lastQuery', rawQuery);
                 
                executeRedirect(matches[0]);
            } else {
                if (errorDiv) {
                    errorDiv.textContent = `"${rawQuery}" not found in the Success Wheel.`;
                    errorDiv.style.display = "block";
                }
                const navControls = document.getElementById('navControls');
                if (navControls) navControls.style.display = 'none';
                sessionStorage.clear();
            }
        }

        function navigateMatches(direction) {
            if (currentMatches.length <= 1) return;

            currentIndex = currentIndex + direction;
            if (currentIndex >= currentMatches.length) currentIndex = 0;
            if (currentIndex < 0) currentIndex = currentMatches.length - 1;

            sessionStorage.setItem('currentIndex', currentIndex.toString());
            executeRedirect(currentMatches[currentIndex]);
        }

        function updateNavigationUI() {
            const navControls = document.getElementById('navControls');
            const matchCountLabel = document.getElementById('matchCount');

            if (!navControls || !matchCountLabel) return;

            if (currentMatches.length > 0) {
                navControls.style.display = 'flex';
                matchCountLabel.textContent = `${currentIndex + 1} of ${currentMatches.length}`;
            } else {
                navControls.style.display = 'none';
            }
        }

        function executeRedirect(slideId) {
            const currentUrlWithoutParams = window.location.href.split('?')[0];
            let cleanId = slideId.replace(/^id\./gi, '');
            const targetSlide = "id." + cleanId;
            const newUrl = currentUrlWithoutParams + "?slide=" + targetSlide;
             
            history.pushState({slide: targetSlide}, '', newUrl);
            const iframe = document.getElementById('slidesIframe');
            if (iframe) {
                iframe.src = baseUrl + "&slide=" + targetSlide;
            }
            updateNavigationUI();
        }

        function toggleFullscreen() {
            const container = document.getElementById('dashboardContainer');
            if (!container) return;

            if (!document.fullscreenElement) {
                container.requestFullscreen().catch(err => {
                    console.error(`Error moving to fullscreen: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        }

        // Listener updates icon based on actual full-screen state (including ESC key presses)
        document.addEventListener('fullscreenchange', () => {
            const fsIcon = document.getElementById('fsIcon');
            const fsBtn = document.getElementById('fsToggleBtn');
            if (!fsIcon || !fsBtn) return;

            if (document.fullscreenElement) {
                fsIcon.innerHTML = compressIconPath;
                fsBtn.setAttribute('title', 'Exit Fullscreen');
            } else {
                fsIcon.innerHTML = expandIconPath;
                fsBtn.setAttribute('title', 'Toggle Fullscreen');
            }
        });
    </script>
</body>
</html>
