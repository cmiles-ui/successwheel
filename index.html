<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Success Wheel Search Dashboard</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            background-color: #000000; 
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 100%; 
            background: #000000;
            padding: 10px;
            border-radius: 0;
            box-shadow: none; 
            border: none; 
            transition: all 0.3s ease;
        }
        .container:fullscreen {
            max-width: 100vw;
            width: 100vw;
            height: 100vh;
            background: #000000;
            padding: 20px;
            border-radius: 0;
            border: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .search-box { 
            margin: 0 auto 0 auto; 
            max-width: 750px; 
            display: flex; 
            gap: 6px; 
            align-items: center;
            width: 100%;
        }
        .container:fullscreen .search-box {
            max-width: 850px;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 0;
        }
        input[type="text"] { 
            flex: 1; 
            padding: 8px 12px; 
            font-size: 14px; 
            background-color: #282828; 
            color: #ffffff;
            border: 1.5px solid #3c3c3e; 
            border-radius: 6px; 
            outline: none; 
            transition: border-color 0.2s, background-color 0.2s;
            height: 35px;
        }
        input[type="text"]::placeholder { color: #a0a0a0; }
        input[type="text"]:focus { border-color: #1a73e8; }
        
        /* Override Chrome/Safari Autofill Styles */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 30px #282828 inset !important;
            -webkit-text-fill-color: #ffffff !important;
            caret-color: #ffffff;
            transition: background-color 5000s ease-in-out 0s;
        }

        button { 
            padding: 0; 
            font-size: 14px; 
            background-color: #2c2c2e; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: 600; 
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 35px;
            width: 35px;
            flex-shrink: 0;
        }
        button:hover { background-color: #3a3a3c; }
        button svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }
         
        .icon-btn {
            background-color: #2c2c2e;
            color: #ffffff;
        }
        .icon-btn:hover { background-color: #3a3a3c; }
         
        .nav-controls {
            display: flex; 
            gap: 4px;
            align-items: center;
        }
        .nav-btn {
            background-color: #2c2c2e;
            color: #ffffff;
            padding: 0 12px;
            font-size: 13px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            height: 35px;
            width: auto;
        }
        .nav-btn:hover { background-color: #3a3a3c; }

        .match-count {
            font-size: 13px;
            color: #e8eaed;
            min-width: 70px;
            text-align: center;
            font-weight: 500;
        }

        .error-message { 
            color: #f28b82; 
            font-size: 13px; 
            margin-top: 2px; 
            margin-bottom: 0; 
            display: none; 
            text-align: center; 
            font-weight: 500;
        }

        /* AI Answer Card Styling */
        .ai-card {
            display: none;
            max-width: 750px;
            margin: 4px auto 0 auto;
            background: #1e1e1e;
            border: 1px solid #333333;
            border-radius: 8px;
            padding: 12px 16px;
            color: #e8eaed;
            font-size: 14px;
            line-height: 1.5;
        }
        .ai-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            font-weight: 600;
            color: #8ab4f8;
            margin-bottom: 6px;
        }
        .ai-close-btn {
            cursor: pointer;
            color: #888;
            font-size: 16px;
            line-height: 1;
        }
        .ai-close-btn:hover { color: #fff; }

        /* Gemini Dancing Dots Loader */
        .dots-loader {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 0;
        }
        .dots-loader div {
            width: 8px;
            height: 8px;
            background-color: #8ab4f8;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .dots-loader div:nth-child(1) { animation-delay: -0.32s; }
        .dots-loader div:nth-child(2) { animation-delay: -0.16s; }
        .dots-loader div:nth-child(3) { animation-delay: 0s; }

        @keyframes bounce {
            0%, 80%, 100% { 
                transform: scale(0.3);
                opacity: 0.4;
            } 
            40% { 
                transform: scale(1.0);
                opacity: 1;
            }
        }

        .iframe-wrapper { 
            position: relative; 
            width: 100%; 
            padding-top: 56.25%; 
            height: 0; 
            border-radius: 8px; 
            overflow: hidden; 
            background: #000; 
            margin-top: 0;
        }
        .container:fullscreen .iframe-wrapper {
            flex: 1;
            padding-top: 0;
            height: auto;
        }
        iframe { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            border: none; 
        }
    </style>
    <script src="data.js"></script>
</head>
<body>

    <div class="container" id="dashboardContainer">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search or ask a question...">
            <button onclick="handleSearch()" title="Search Knowledge">
                <svg viewBox="0 0 24 24">
                    <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                </svg>
            </button>
             
            <div class="nav-controls" id="navControls">
                <button class="nav-btn" onclick="navigateMatches(-1)">◀</button>
                <span class="match-count" id="matchCount">0 of 0</span>
                <button class="nav-btn" onclick="navigateMatches(1)">▶</button>
            </div>
             
            <button class="icon-btn" id="fsToggleBtn" onclick="toggleFullscreen()" title="Toggle Fullscreen">
                <svg id="fsIcon" viewBox="0 0 24 24">
                    <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
                </svg>
            </button>
        </div>

        <!-- AI Summary Card -->
        <div id="aiCard" class="ai-card">
            <div class="ai-card-header">
                <span>✨ AI ANSWER</span>
                <span class="ai-close-btn" onclick="closeAICard()">✕</span>
            </div>
            <div id="aiAnswerContent"></div>
        </div>

        <div id="errorMessage" class="error-message"></div>

        <div class="iframe-wrapper">
            <iframe id="slidesIframe" allowfullscreen="true"></iframe>
        </div>
    </div>

    <script>
        const baseUrl = "https://docs.google.com/presentation/d/16m363rm8KbODBF4_73Jt824KoW6NaEQsueUZ_LTdyFU/embed?start=false&loop=false&delayms=3000&rm=minimal";
        const workerUrl = "https://successwheel-ai.cmiles.workers.dev"; 

        const expandIconPath = '<path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>';
        const compressIconPath = '<path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/>';

        let currentMatches = [];
        let currentIndex = 0;

        function getAllSlideIds() {
            const masterData = window.slideData || [];
            return masterData.map(item => item.id);
        }

        function getTitleSlideId() {
            const masterData = window.slideData || [];
            return masterData.length > 0 ? masterData[0].id : "id.p";
        }

        document.addEventListener("DOMContentLoaded", function() {
            const defaultSlide = getTitleSlideId();

            const iframe = document.getElementById('slidesIframe');
            if (iframe) {
                iframe.src = baseUrl + "&slide=" + defaultSlide;
            }

            const currentUrlWithoutParams = window.location.href.split('?')[0];
            history.replaceState({slide: defaultSlide}, '', currentUrlWithoutParams);

            const inputField = document.getElementById('searchInput');
            if (inputField) {
                inputField.value = '';
                inputField.addEventListener('keypress', function (e) {
                    if (e.key === 'Enter') { handleSearch(); }
                });
            }

            sessionStorage.clear();
            currentMatches = getAllSlideIds();
            currentIndex = 0;

            updateNavigationUI();
        });

        function filterSlidesLocally(query) {
            const masterData = window.slideData || [];
            const titleId = getTitleSlideId();
            
            const contentSlides = masterData.filter(item => item.id !== titleId && item.id !== "id.p");

            if (!query) return contentSlides.map(item => item.id);

            const stopWords = new Set([
                "how", "do", "we", "i", "can", "move", "into", "to", "the", "a", "an", "is", "of", 
                "and", "or", "for", "on", "another", "what", "become", "be", "in", "my", "our",
                "would", "like", "want", "should", "if", "get", "feel", "about", "who", "company", "employees"
            ]);
            
            const terms = query.toLowerCase()
                .replace(/[^\w\s]/gi, '')
                .split(/\s+/)
                .filter(term => term.length > 2 && !stopWords.has(term));

            if (terms.length === 0) {
                return contentSlides.slice(0, 3).map(item => item.id);
            }

            const strictMatches = contentSlides.filter(item => {
                const slideText = (item.keywords || "").toLowerCase();
                return terms.every(term => slideText.includes(term));
            }).map(item => item.id);

            if (strictMatches.length > 0) {
                return strictMatches.slice(0, 3);
            }

            const looseMatches = contentSlides.filter(item => {
                const slideText = (item.keywords || "").toLowerCase();
                return terms.some(term => slideText.includes(term));
            }).map(item => item.id);

            return looseMatches.length > 0 ? looseMatches.slice(0, 3) : contentSlides.slice(0, 3).map(item => item.id);
        }

        function handleSearch() {
            const inputField = document.getElementById('searchInput');
            if (!inputField) return;

            const prompt = inputField.value.trim();
            const errorDiv = document.getElementById('errorMessage');

            if (!prompt) { 
                closeAICard();
                if (errorDiv) errorDiv.style.display = "none"; 
                currentMatches = getAllSlideIds();
                currentIndex = 0;
                sessionStorage.clear();
                executeRedirect(currentMatches[0] || 'id.p');
                return; 
            }

            currentMatches = filterSlidesLocally(prompt);
            currentIndex = 0;
            updateNavigationUI();

            if (currentMatches.length > 0) {
                executeRedirect(currentMatches[0]);
            }

            askAI(prompt);
        }

        async function askAI(prompt) {
            const aiCard = document.getElementById('aiCard');
            const aiContent = document.getElementById('aiAnswerContent');
            const errorDiv = document.getElementById('errorMessage');
            if (!aiCard || !aiContent) return;

            if (errorDiv) errorDiv.style.display = "none";

            aiContent.innerHTML = '<div class="dots-loader"><div></div><div></div><div></div></div>';
            aiCard.style.display = "block";

            const masterData = window.slideData || [];
            const fullContext = masterData.map(item => {
                const text = item.keywords || "";
                return `[Slide ID: ${item.id}]\n${text}`;
            }).join("\n---\n");

            try {
                const response = await fetch(workerUrl, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prompt, context: fullContext })
                });

                const data = await response.json();

                if (!response.ok || data.error) {
                    aiContent.textContent = "Error: " + (data.error || "Unable to reach Cloudflare Worker.");
                    return;
                }

                aiContent.textContent = data.reply || "Unable to retrieve AI answer.";

                const titleId = getTitleSlideId();
                let targetSlides = [];

                if (data.rankedSlides && Array.isArray(data.rankedSlides) && data.rankedSlides.length > 0) {
                    targetSlides = data.rankedSlides;
                } else if (data.bestSlideId) {
                    targetSlides = [data.bestSlideId];
                }

                if (targetSlides.length > 0) {
                    const masterIds = getAllSlideIds();
                    const validRanked = [];

                    targetSlides.forEach(target => {
                        const cleanTarget = target.replace(/^(id\.|slide\.|#)/gi, '').trim().toLowerCase();
                        if (!cleanTarget) return;

                        const foundMasterIdx = masterIds.findIndex(id => {
                            const cleanMaster = id.replace(/^(id\.|slide\.|#)/gi, '').trim().toLowerCase();
                            return cleanMaster === cleanTarget || cleanMaster.includes(cleanTarget) || cleanTarget.includes(cleanMaster);
                        });

                        if (foundMasterIdx !== -1) {
                            const foundId = masterIds[foundMasterIdx];
                            if (foundId !== titleId && foundId !== "id.p" && !validRanked.includes(foundId)) {
                                validRanked.push(foundId);
                            }
                        }
                    });

                    if (validRanked.length > 0) {
                        currentMatches = validRanked.slice(0, 5);
                        currentIndex = 0;
                        executeRedirect(currentMatches[0]);
                    }
                }

            } catch (err) {
                aiContent.textContent = "Error connecting to AI service. Ensure your Worker URL is configured correctly.";
            }
        }

        function closeAICard() {
            const aiCard = document.getElementById('aiCard');
            if (aiCard) aiCard.style.display = "none";
        }

        function navigateMatches(direction) {
            if (currentMatches.length <= 1) return;

            currentIndex = currentIndex + direction;
            if (currentIndex >= currentMatches.length) currentIndex = 0;
            if (currentIndex < 0) currentIndex = currentMatches.length - 1;

            sessionStorage.setItem('currentIndex', currentIndex.toString());
            executeRedirect(currentMatches[currentIndex]);
        }

        function updateNavigationUI() {
            const navControls = document.getElementById('navControls');
            const matchCountLabel = document.getElementById('matchCount');

            if (!navControls || !matchCountLabel) return;

            if (currentMatches.length > 0) {
                navControls.style.display = 'flex';
                matchCountLabel.textContent = `${currentIndex + 1} of ${currentMatches.length}`;
            } else {
                navControls.style.display = 'none';
            }
        }

        function executeRedirect(slideId) {
            const currentUrlWithoutParams = window.location.href.split('?')[0];
            let cleanId = slideId.replace(/^id\./gi, '');
            const targetSlide = "id." + cleanId;
            const newUrl = currentUrlWithoutParams + "?slide=" + targetSlide;
             
            history.pushState({slide: targetSlide}, '', newUrl);
            const iframe = document.getElementById('slidesIframe');
            if (iframe) {
                iframe.src = baseUrl + "&slide=" + targetSlide;
            }
            updateNavigationUI();
        }

        function toggleFullscreen() {
            const container = document.getElementById('dashboardContainer');
            if (!container) return;

            if (!document.fullscreenElement) {
                container.requestFullscreen().catch(err => {
                    console.error(`Error moving to fullscreen: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        }

        document.addEventListener('fullscreenchange', () => {
            const fsIcon = document.getElementById('fsIcon');
            const fsBtn = document.getElementById('fsToggleBtn');
            if (!fsIcon || !fsBtn) return;

            if (document.fullscreenElement) {
                fsIcon.innerHTML = compressIconPath;
                fsBtn.setAttribute('title', 'Exit Fullscreen');
            } else {
                fsIcon.innerHTML = expandIconPath;
                fsBtn.setAttribute('title', 'Toggle Fullscreen');
            }
        });
    </script>
</body>
</html>
